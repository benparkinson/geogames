logging.level.org.zalando.logbook: TRACE
spring.main.banner-mode=off
# H2 in PostgreSQL mode, so the same Flyway migrations run here as on the production Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
geogames.cors.allowed-origins=http://localhost:3000,https://geogauntlet.onrender.com
spring.jpa.open-in-view=false
# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Games are deleted a day after they are created, by a job that runs at start-up and then every
# cleanup-interval. With the default H2 they also vanish on restart.
geogames.games.max-age=PT24H
geogames.games.cleanup-interval=PT1H

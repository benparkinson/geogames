logging.level.org.zalando.logbook: TRACE
spring.main.banner-mode=off
# H2 in PostgreSQL mode, so the same Flyway migrations run here as on the production Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
geogames.cors.allowed-origins=http://localhost:3000,https://geogauntlet.onrender.com,https://geoggernaut.com,https://www.geoggernaut.com
spring.jpa.open-in-view=false
# Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Games are deleted a day after they are created, by a job that runs at start-up and then every
# cleanup-interval. With the default H2 they also vanish on restart.
geogames.games.max-age=PT24H
geogames.games.cleanup-interval=PT1H
# Challenge-a-friend links (the rounds and score of a finished game) are deleted after a week,
# by the same job, on their creation date.
geogames.challenges.max-age=P7D

# Game creation limits. games-per-window is how many games one client may start per window across
# both creation endpoints; 0 turns it off (application-prod.properties turns it on).
geogames.rate-limit.games-per-window=0
geogames.rate-limit.window=PT10M
# At most this many clients are tracked; when full, expired ones are dropped, then requests are allowed.
geogames.rate-limit.max-clients=10000
# X-Forwarded-For entries counted from the right: 1 is the one the host's proxy appends.
geogames.rate-limit.forwarded-hops=1
# New games are refused (503) while the database holds this many.
geogames.games.max-live=50000

# Anonymous per-round statistics, written to the stat_* tables after each answer commits
#. false turns recording off.
geogames.stats.enabled=true

# Metrics (Micrometer): counts and timings are pushed over OTLP, never scraped. Export is off here
# (tests and CI never touch the network); application-prod.properties turns it on by env var.
spring.application.name=geogames
management.otlp.metrics.export.enabled=false
management.otlp.metrics.export.step=60s
management.otlp.metrics.export.histogram-flavor=base2_exponential_bucket_histogram
# Request latency as a histogram, so Grafana can show any percentile.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# No actuator web endpoints (/health is our own HealthController).
management.endpoints.web.exposure.exclude=*

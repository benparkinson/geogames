logging.level.org.zalando.logbook: TRACE
spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
geogames.cors.allowed-origins=http://localhost:3000,https://geogauntlet.onrender.com
spring.jpa.open-in-view=false

# Games live in memory and are deleted a day after they are created.
geogames.games.max-age=PT24H
geogames.games.cleanup-interval=PT1H

# Production (Render): games are stored in Postgres (Neon). Turned on with SPRING_PROFILES_ACTIVE=prod.
# The default profile needs none of this and uses H2 in memory.
#
# DATABASE_URL is a JDBC URL, jdbc:postgresql://<host>/<db>?sslmode=require&channelBinding=require,
# not Neon's postgresql://user:password@... form: the JDBC driver takes the user and password
# separately. Use Neon's direct endpoint, not the -pooler one: a single instance with a pool of 5
# doesn't need PgBouncer, and the direct endpoint avoids prepared-statement problems with
# transaction pooling.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# A single small instance: a few connections are plenty, and with none idle the pool lets
# Neon's compute sleep when nobody is playing.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# A database that has just woken can take a few seconds to accept connections.
spring.datasource.hikari.connection-timeout=15000

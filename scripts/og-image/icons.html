<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Geoggernaut app icon</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #102d31;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- The logo from og-image.html (keep them the same), cropped to the outer edge of its frame. -->
    <svg viewBox="5 5 118 118">
      <rect x="8" y="8" width="112" height="112" rx="6" fill="#f7f7f4" />
      <path
        d="M8 8H55C52 14 53 22 55 26C60 34 60 36 59 45L57 53L58 66L43 68C32 69 27 73 22 77C17 80 14 81 8 81Z"
        fill="#ffd23f"
      />
      <path
        d="M8 81C14 81 17 80 22 77C27 73 32 69 43 68L58 66L70 71C76 76 83 83 90 84C101 86 108 95 120 100V120H8Z"
        fill="#1d5c63"
      />
      <g fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linejoin="round">
        <path d="M55 8C52 14 53 22 55 26C60 34 60 36 59 45L57 58" />
        <path d="M8 81C14 81 17 80 22 77C27 73 32 69 43 68L52 66" />
        <path d="M68 70C76 76 83 83 90 84C101 86 108 95 120 100" />
      </g>
      <rect x="8" y="8" width="112" height="112" rx="6" fill="none" stroke="#1a1a1a" stroke-width="6" />
      <circle cx="58" cy="65.5" r="13.5" fill="#f7f7f4" stroke="#1a1a1a" stroke-width="3.5" />
      <circle cx="58" cy="65.5" r="9" fill="#d9481c" />
      <path d="M86 35C87 24 102 25 102 35C102 42 93 42 93 49" fill="none" stroke="#1a1a1a" stroke-width="6.5" />
      <rect x="89.5" y="52" width="7" height="7" fill="#1a1a1a" />
    </svg>
    <script>
      // ?size=<pixels>&variant=maskable. A maskable icon may be cropped to a circle 80% of its width,
      // so the square logo's diagonal has to fit inside it: 0.8 / √2 ≈ 0.56.
      const query = new URLSearchParams(location.search);
      const size = Number(query.get("size"));
      const side = Math.round(size * (query.get("variant") === "maskable" ? 0.56 : 0.82));
      const logo = document.querySelector("svg");
      logo.setAttribute("width", side);
      logo.setAttribute("height", side);
    </script>
  </body>
</html>

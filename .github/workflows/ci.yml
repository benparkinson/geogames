name: CI

# One job per kind of failure, so a red check says what broke. The last job, `test`, is the aggregate
# that branch protection requires: keep its id and name.

# No run on a push to main: branch protection makes every PR up to date with main before it merges,
# so the merge commit is what its PR's last run tested. A draft PR runs nothing (every job, `test`
# included, is skipped) until it is marked ready for review; a draft cannot be merged.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Monday morning: finds breakage that arrives without a commit (the runner image, the floating
  # Docker base tags Render also builds from, Playwright's system packages).
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs. Every other run (the weekly run, a manual run) has a group
# of its own: a shared group keeps only one pending run and cancels the rest.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs from the files it changes. Each output is named after the
  # job it gates; `test` fails if a job was skipped although its output is true. A change to the
  # workflows or scripts/, and every run that is not a pull request, runs everything.
  changes:
    name: changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint-frontend: ${{ steps.filter.outputs.lint-frontend }}
      unit-backend: ${{ steps.filter.outputs.unit-backend }}
      unit-frontend: ${{ steps.filter.outputs.unit-frontend }}
      build: ${{ steps.filter.outputs.build }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      # A pull request checks out the merge commit: its first parent is the base, so HEAD^1..HEAD is
      # exactly what the pull request changes.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Choose the jobs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files=ALL
          fi
          echo "Changed files:"; echo "$files"
          changed() { echo "$files" | grep -qE "$1|^ALL$|^\.github/|^scripts/"; }
          backend='^src/|^pom\.xml$|^\.mvn/|^mvnw$'
          frontend='^client/'
          e2e='^e2e/'
          set_job() { if changed "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # Also scripts/check-versions.sh (pom.xml, the Dockerfile) and the @Disabled scan of src/test/.
          set_job lint-frontend "$frontend|$e2e|^pom\.xml$|^Dockerfile$|^src/test/"
          set_job unit-backend "$backend"
          set_job unit-frontend "$frontend"
          set_job build "$backend|$frontend|$e2e"
          # HttpServerIT serves the built frontend and ApiContractIT reads client/src/test/api-shapes.json.
          set_job integration "$backend|$frontend"
          set_job e2e "$backend|$frontend|$e2e"
          set_job docker "$backend|$frontend|^Dockerfile$|^\.dockerignore$"
          # The loaders may use any main class.
          set_job data '^src/main/|^geodata/|^pom\.xml$'
          cat "$GITHUB_OUTPUT"

  lint-frontend:
    name: lint-frontend
    needs: changes
    if: needs.changes.outputs.lint-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      # Java: pom.xml, every setup-java and the Dockerfile's temurin images. Node: pom.xml
      # <nodeVersion> (Maven's Node), client/.nvmrc (setup-node's) and the @types/node majors.
      # A Dependabot bump that moves only one of them (a Docker tag, @types/node) fails here.
      - name: Check Java and Node versions agree
        run: bash scripts/check-versions.sh

      # A committed .skip, .fixme or @Disabled passes every other job.
      - name: Check no test is skipped or focused
        run: bash scripts/check-no-skipped-tests.sh

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      # A plugin outside its ESLint peer range can stop reporting without crashing, and lint
      # still passes on clean code. This fails unless a rule from each plugin still fires.
      - name: Check every ESLint plugin still reports
        working-directory: client
        run: npm run lint:rules

      - name: Type-check
        working-directory: client
        run: npm run typecheck

      - name: Install browser-test dependencies
        working-directory: e2e
        run: npm ci

      # Playwright strips types without checking them, so the e2e job alone misses type errors.
      - name: Type-check the browser tests
        working-directory: e2e
        run: npm run typecheck

  unit-backend:
    name: unit-backend
    needs: changes
    if: needs.changes.outputs.unit-backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # One Maven cache per job. setup-java's `cache: maven` shares one key between all the Java
      # jobs, so the first to finish (a Spotless-only job, then) saved it and the others downloaded
      # everything from Maven Central on every run, until Central answered 429.
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ github.job }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-${{ github.job }}-

      # A step of this job rather than a job of its own: a job is billed by the whole minute, and
      # Spotless takes about 20 seconds. Fails when Java is not formatted by google-java-format; fix
      # with `mvn spotless:apply`.
      - name: Check Java formatting
        run: ./mvnw -B spotless:check

      # No Node here: the Java unit tests do not need the frontend. Includes the JaCoCo coverage gate.
      - name: Java unit tests and coverage gate
        run: ./mvnw -B verify -Dskip.frontend -DskipITs -Dspotless.check.skip=true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-backend-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
          retention-days: 3

  unit-frontend:
    name: unit-frontend
    needs: changes
    if: needs.changes.outputs.unit-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Run first and on its own, so a contract break is named in the failing step. Fails when the
      # frontend fixtures no longer match the backend shapes in client/src/test/api-shapes.json.
      - name: Frontend contract test
        working-directory: client
        run: npx vitest run src/api/contract.test.ts

      - name: Vitest with coverage thresholds
        working-directory: client
        run: npm run coverage -- --reporter=default --reporter=github-actions

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-frontend-coverage
          path: client/coverage
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # One Maven cache per job (see unit-backend).
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ github.job }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-${{ github.job }}-

      # Maven installs Node itself (see <nodeVersion> in pom.xml), so no setup-node here.
      # NEXT_PUBLIC_API_URL makes the bundled site call the local backend instead of production. This
      # jar only feeds the integration and e2e jobs: production is built by Render, which the docker
      # job covers.
      - name: Build the frontend and the jar
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: ./mvnw -B package -DskipTests -Dskip.lint -Dspotless.check.skip=true -Djacoco.skip=true

      # Handed to integration and e2e through the Actions cache, not as artifacts: artifact storage
      # counts against the account's quota, the cache does not. The paths must be the same in every
      # save and restore. The key is per run, so a rerun of a later job finds it; GitHub evicts the
      # entry after a week unused (or sooner, least recently used first, when the repo passes 10 GB).
      - name: Save the jar and the built frontend
        uses: actions/cache/save@v6
        with:
          path: |
            target/geogames-0.0.1-SNAPSHOT.jar
            client/out
          key: ci-build-${{ github.run_id }}

  integration:
    name: integration
    needs: [changes, build]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # One Maven cache per job (see unit-backend).
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ github.job }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-${{ github.job }}-

      # HttpServerIT serves the static site from the classpath, so it needs the frontend build.
      - name: Restore the jar and the built frontend
        uses: actions/cache/restore@v6
        with:
          path: |
            target/geogames-0.0.1-SNAPSHOT.jar
            client/out
          key: ci-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Backend integration tests (including the contract and data checks)
        run: ./mvnw -B verify -Dskip.frontend -DskipUnitTests -Dspotless.check.skip=true -Djacoco.skip=true

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: e2e
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-package: jre
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Saved by build (see there).
      - name: Restore the jar and the built frontend
        uses: actions/cache/restore@v6
        with:
          path: |
            target/geogames-0.0.1-SNAPSHOT.jar
            client/out
          key: ci-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image Render builds from the Dockerfile.
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: geogames:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Production runs this image with the prod profile against Postgres (Neon runs major 17).
      - name: Start Postgres
        run: |
          docker network create geogames-ci
          docker run -d --name postgres --network geogames-ci             -e POSTGRES_USER=geogames -e POSTGRES_PASSWORD=geogames -e POSTGRES_DB=geogames             postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U geogames -d geogames > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Postgres did not become ready within 30 seconds"
          exit 1

      # 512 MB is the memory of the Render instance; the Dockerfile runs the app with -Xmx400M.
      - name: Start the container
        run: |
          docker run -d --name geogames --network geogames-ci --memory=512m -p 8080:8080             -e SPRING_PROFILES_ACTIVE=prod             -e DATABASE_URL=jdbc:postgresql://postgres:5432/geogames             -e DATABASE_USERNAME=geogames -e DATABASE_PASSWORD=geogames             geogames:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Up after about $((i * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The container did not answer /health within 180 seconds"
          exit 1

      - name: Check the API
        run: |
          countries=$(curl -sf http://localhost:8080/api/countries | jq 'length')
          echo "countries: ${countries}"
          test "${countries}" -gt 200

          game=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"gameType":"RANDOM","numberOfRounds":1}' http://localhost:8080/api/games)
          # -r prints the UUID without its JSON quotes.
          id=$(echo "${game}" | jq -er '.id')
          echo "game: ${id}"

          curl -sf "http://localhost:8080/api/games/${id}/rounds/0" \
            | jq -e '.totalRoundCount == 1 and (.jsonBlob | length) > 0'

      # Proves the game above went to Postgres, not to H2.
      - name: Check the game is in Postgres
        run: |
          games=$(docker exec postgres psql -U geogames -d geogames -tAc 'select count(*) from game_entity')
          echo "games: ${games}"
          test "${games}" -ge 1

      # Errors off the request thread (the cleanup job at start-up, the statistics writer) fail no
      # request, so the calls above pass. They do log at ERROR.
      - name: Check the container logged no errors
        run: |
          docker logs geogames > container.log 2>&1
          if grep -E ' ERROR | OutOfMemoryError' container.log; then
            echo "::error::The container logged errors (see above)"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: |
          docker logs geogames
          docker logs postgres

  data:
    name: data
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # One Maven cache per job (see unit-backend).
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ github.job }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-${{ github.job }}-

      # Regenerates the country, country shape, river and lake data from geodata/ and compares it with
      # src/main/resources/processed/. Fails when geodata/ or a loader changed and the data was not
      # regenerated. Run the same script locally.
      - name: Check the committed data is current
        run: bash scripts/check-processed-data.sh

  test:
    name: test
    # The required status check on main: it passes only if every job above succeeded, or was skipped
    # because `changes` said the pull request does not need it.
    needs:
      - changes
      - lint-frontend
      - unit-backend
      - unit-frontend
      - build
      - integration
      - e2e
      - docker
      - data
    # Skipped on a draft, like every other job (see `on:`).
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r '
            .changes.outputs as $run
            | to_entries[]
            | "\(.key): \(.value.result)\(if .key != "changes" and $run[.key] != "true" then " (not needed)" else "" end)"'
          echo "$NEEDS" | jq -e '
            .changes.result == "success"
            and (.changes.outputs as $run
              | del(.changes) | to_entries
              | all(.value.result == "success" or (.value.result == "skipped" and $run[.key] != "true")))' > /dev/null \
            || { echo "::error::A needed job failed, was cancelled or was skipped"; exit 1; }

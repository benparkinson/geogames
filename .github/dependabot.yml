version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/client"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (typescript-eslint#10940), so lint breaks.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The @types/node major follows the runtime Node (client/.nvmrc); scripts/check-versions.sh
      # fails otherwise. Bump it by hand together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    ignore:
      # Kept in step with /client, for the same reasons.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
  # Dependabot files a JDK change in a tag (maven:3.9-eclipse-temurin-25 -> -26) as a minor
  # update. scripts/check-versions.sh fails such a PR: a Java upgrade must also change
  # <java.version> and every setup-java, so do it by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
